<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOBLIK Digest — Démonstration</title>
    <link rel="stylesheet" href="../entrypoints/popup/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p>OOBLIK DIGEST</p>
        <h1>Ajouter ce lien.</h1>
      </header>
      <form>
        <label>
          URL
          <input type="url" value="https://exemple.fr/article-remarquable" />
        </label>
        <label>
          Titre
          <input value="Un article remarquable sur le design éditorial" />
        </label>
        <label>
          Catégorie
          <select>
            <option>Design graphique</option>
          </select>
        </label>
        <label>
          Résumé
          <textarea rows="4">Une ressource choisie pour sa réflexion claire sur les formes éditoriales contemporaines.</textarea>
        </label>
        <div class="tag-suggestions">
          <span>Suggestions pour cette page</span>
          <div class="suggested-tags">
            <button type="button">design</button>
            <button type="button">typographie</button>
          </div>
        </div>
        <div class="tags">
          <span class="tag">design <button type="button" aria-label="Retirer design">×</button></span>
        </div>
        <p class="tag-count">1/5 tags sélectionnés</p>
        <label for="demo-tag-search">Rechercher un tag existant</label>
        <div class="tag-combobox">
          <input id="demo-tag-search" type="search" placeholder="Nom, description ou alias…" />
        </div>
        <label>
          Note privée
          <textarea rows="3">À relire avant la prochaine édition.</textarea>
        </label>
        <p class="completeness">Prêt à rejoindre la file éditoriale.</p>
        <button class="primary" type="button">Enregistrer le brouillon</button>
      </form>
    </main>
  </body>
</html>
