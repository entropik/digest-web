<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter au Digest</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p>OOBLIK DIGEST</p>
        <h1>Ajouter ce lien.</h1>
      </header>
      <section id="login" hidden>
        <p>Connectez-vous à l’espace propriétaire avant de capturer cette page.</p>
        <button id="login-button" class="primary" type="button">
          Ouvrir l’administration
        </button>
      </section>
      <form id="capture-form" hidden>
        <label class="field-full">
          URL
          <input id="url" name="url" type="url" required />
        </label>
        <div class="field-row title-row">
          <label>
            Titre
            <input id="title" name="title" maxlength="240" />
          </label>
          <label>
            Catégorie
            <select id="category" name="category"></select>
          </label>
        </div>
        <div class="field-row text-row">
          <label>
            Résumé
            <textarea id="description" name="description" rows="3"></textarea>
          </label>
          <label>
            Note privée
            <textarea id="private-note" name="privateNote" rows="3"></textarea>
          </label>
        </div>
        <div id="tag-suggestions" class="tag-suggestions" hidden>
          <span>Suggestions pour cette page</span>
          <div id="suggested-tags" class="suggested-tags"></div>
        </div>
        <div id="selected-tags" class="tags" aria-live="polite"></div>
        <p id="tag-count" class="tag-count">0/5 tags sélectionnés</p>
        <label class="field-full" id="tag-search-label" for="tag-input">
          Rechercher un tag existant
        </label>
        <div class="tag-combobox">
          <input
            id="tag-input"
            type="search"
            role="combobox"
            aria-labelledby="tag-search-label"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-haspopup="listbox"
            aria-controls="known-tags"
            autocomplete="off"
            placeholder="Nom, description ou alias…"
          />
          <div id="known-tags" class="known-tags" role="listbox"></div>
        </div>
        <section id="create-tag-confirm" class="create-tag-confirm" hidden>
          <p>Ce nouveau tag sera ajouté au registre public du Digest.</p>
          <strong id="create-tag-name"></strong>
          <div>
            <button id="confirm-create-tag" type="button">Créer et sélectionner</button>
            <button id="cancel-create-tag" type="button">Annuler</button>
          </div>
        </section>
        <p id="completeness" class="completeness"></p>
        <button id="save" class="primary" type="submit" disabled>
          Enregistrer le brouillon
        </button>
      </form>
      <div class="status-row">
        <p id="feedback" role="status"></p>
        <button id="discard-local" class="retry" type="button" hidden>
          Oublier la reprise locale
        </button>
        <button id="retry" class="retry" type="button" hidden>
          Réessayer
        </button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
