baseURL: "https://digest.ooblik.com/"
locale: "fr-FR"
defaultContentLanguage: "fr"
title: "Digest"
theme: "PaperMod"

enableRobotsTXT: true
enableGitInfo: false

params:
  env: production
  description: "Une veille choisie sur l’IA, le développement, le design et l’image."
  author: "Marc"
  defaultTheme: light
  disableThemeToggle: false
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"
    theme_color: "#ff5c35"
    msapplication_TileColor: "#ff5c35"
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  footer:
    text: "[Admin](/admin) · [Confidentialité](/confidentialite/)"
  label:
    text: "OOBLIK DIGEST"
  homeInfoParams:
    Title: "Digest web"
    Content: "Liens choisis, dédupliqués et classés."

menu:
  main:
    - identifier: digest
      name: "Liens"
      url: "/"
      weight: 10
    - identifier: archives
      name: "Archives"
      url: "/archives/"
      weight: 20
    - identifier: tags
      name: "Tags"
      url: "/tags/"
      weight: 30
    - identifier: flux
      name: "Flux"
      url: "/flux/"
      weight: 35
    - identifier: about
      name: "À propos"
      url: "/a-propos/"
      weight: 40

outputs:
  home:
    - HTML
    - RSS

minify:
  disableXML: true
  minifyOutput: true
