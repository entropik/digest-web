name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: digest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build production site
        run: hugo --gc --minify --baseURL https://digest.ooblik.com/

      - name: Reject development URLs
        shell: bash
        run: |
          if grep -R -n -E 'https?://(localhost|127\.0\.0\.1)(:[0-9]+)?' public; then
            echo "Development URL found in production output."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Package site
        shell: bash
        run: tar -C public -czf digest-site.tar.gz .

      - name: Upload and activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          release="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          archive="/tmp/digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          scp -P "$DEPLOY_PORT" digest-site.tar.gz "${remote}:${archive}"
          ssh -p "$DEPLOY_PORT" "$remote" \
            "set -eu
             base='${DEPLOY_PATH}'
             mkdir -p \"\$base/releases/${release}\"
             tar -xzf '${archive}' -C \"\$base/releases/${release}\"
             rm -f '${archive}'
             test -s \"\$base/releases/${release}/index.html\"
             ln -sfn \"releases/${release}\" \"\$base/current.new\"
             mv -Tf \"\$base/current.new\" \"\$base/current\"
             cd \"\$base/releases\"
             ls -1dt */ | tail -n +6 | xargs -r rm -rf --"

      - name: Verify production
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            https://digest.ooblik.com/ > /dev/null
