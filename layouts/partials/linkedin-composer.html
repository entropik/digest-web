<dialog class="linkedin-composer" data-linkedin-composer aria-labelledby="linkedin-composer-title">
  <form method="dialog" class="linkedin-composer-form" data-linkedin-form>
    <div class="linkedin-composer-heading">
      <div>
        <p class="digest-kicker">Publication native</p>
        <h2 id="linkedin-composer-title">Préparer le post LinkedIn</h2>
      </div>
      <button type="button" class="linkedin-composer-close" data-linkedin-cancel aria-label="Fermer">×</button>
    </div>
    <div class="linkedin-composer-visual" data-linkedin-visual>
      <img
        class="linkedin-composer-image{{ if eq .format "square" }} is-square{{ end }}"
        data-linkedin-preview
        {{ with .image }}src="{{ . | relURL }}"{{ end }}
        width="1200"
        height="{{ if eq .format "square" }}1200{{ else }}627{{ end }}"
        alt="Grande image qui accompagnera la publication LinkedIn">
      <p class="linkedin-composer-image-status" data-linkedin-image-status role="status" aria-live="polite"></p>
      <button class="linkedin-composer-regenerate" type="button" data-linkedin-regenerate hidden>Régénérer l’image</button>
    </div>
    <label class="linkedin-composer-field">
      <span class="linkedin-composer-field-heading">
        <span>Texte du post</span>
        <span class="linkedin-composer-character-count" data-linkedin-character-count aria-live="polite"></span>
      </span>
      <textarea data-linkedin-text rows="6" aria-describedby="linkedin-composer-character-count" required></textarea>
    </label>
    <label class="linkedin-composer-field">
      <span>Hashtags</span>
      <input data-linkedin-hashtags type="text" aria-describedby="linkedin-composer-character-count">
    </label>
    <span id="linkedin-composer-character-count" class="sr-only">Le compteur inclut le texte, les hashtags et l’adresse partagée.</span>
    <p class="linkedin-composer-tags-note" data-linkedin-tags-note></p>
    <p class="linkedin-composer-url" data-linkedin-url></p>
    <p class="linkedin-composer-account" data-linkedin-account></p>
    <p class="linkedin-composer-account" data-linkedin-composer-feedback role="status" aria-live="polite"></p>
    <div class="linkedin-composer-actions">
      <button type="button" data-linkedin-cancel>Annuler</button>
      <button type="submit" class="archive-linkedin-image" data-linkedin-confirm>Confirmer la publication</button>
    </div>
  </form>
</dialog>
