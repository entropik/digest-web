name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: digest-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Validate digest data
        run: |
          python3 skills/curate-web-digest/scripts/curate_links.py --check --site .
          node scripts/resolve_wayback_links.mjs --check
          python3 scripts/check_digest_consistency.py --site .

      - name: Build production site
        run: hugo --gc --minify --baseURL https://digest.ooblik.com/

      - name: Reject development URLs
        shell: bash
        run: |
          if grep -R -n -E 'https?://(localhost|127\.0\.0\.1)(:[0-9]+)?' public; then
            echo "Development URL found in production output."
            exit 1
          fi

      - name: Publish production branch
        shell: bash
        run: |
          set -euo pipefail
          touch public/.nojekyll
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b production
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
