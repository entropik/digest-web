baseURL: "https://digest.ooblik.com/"
locale: "fr-FR"
defaultContentLanguage: "fr"
title: "Digest"
theme: "PaperMod"

module:
  mounts:
    - source: "content"
      target: "content"
    - source: "data"
      target: "data"
    - source: "layouts"
      target: "layouts"
    - source: "i18n"
      target: "i18n"
    - source: "archetypes"
      target: "archetypes"
    - source: "assets"
      target: "assets"
    - source: "static"
      target: "static"
    - source: "docs/journal"
      target: "assets/journal"

enableRobotsTXT: true
enableGitInfo: false
# Tag archives are explicit pages under content/tags; Hugo taxonomies would
# generate competing accented URLs and duplicate RSS outputs for the same tags.
taxonomies: {}

params:
  env: production
  description: "Une veille choisie sur l’IA, le développement, le design et l’image."
  author: "Marc"
  defaultTheme: light
  disableThemeToggle: false
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#ff5c35"
    msapplication_TileColor: "#ff5c35"
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  footer:
      text: "v1.24.1 · [Admin](/admin) · [Confidentialité](/confidentialite/)"
  label:
    text: "OOBLIK DIGEST"
  homeInfoParams:
    Title: "Digest web"
    Content: "Liens choisis, dédupliqués et classés."

menu:
  main:
    - identifier: digest
      name: "Liens"
      url: "/"
      weight: 10
    - identifier: archives
      name: "Archives"
      url: "/archives/"
      weight: 20
    - identifier: tags
      name: "Tags"
      url: "/tags/"
      weight: 30
    - identifier: flux
      name: "Flux"
      url: "/flux/"
      weight: 35
    - identifier: about
      name: "À propos"
      url: "/a-propos/"
      weight: 40

outputs:
  home:
    - HTML
    - RSS

minify:
  disableXML: true
  minifyOutput: true
